# =============================================================================
# SayIt Configuration
# =============================================================================
# Secrets (API keys, passwords) → .env
# Everything else → this file
# =============================================================================

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:                      # Allowed CORS origins
    - "*"                            # Default: allow all. Restrict in production.
  # Max HTTP request body size, counted on the bytes actually received (oversize -> 413).
  # WebSocket audio is not affected. Uncomment to override the defaults shown here.
  # body_limits:
  #   diagnostics_mib: 52              # POST /api/diagnostics (the endpoint itself also caps the zip at 50 MiB)
  #   asr_corrections_mib: 11          # POST /api/asr-corrections (audio itself is capped at 10 MiB)
  #   feedback_kib: 512                # POST /api/feedback
  #   admin_mib: 8                     # /admin/... (only exists on deployments with the admin dashboard)
  #   default_kib: 1024                # everything else

# HTTPS reverse proxy (when not using ALB/CDN)
gateway:
  host: "0.0.0.0"
  port: 8443
  backend_target: "http://127.0.0.1:8000"
  tls_key_file: "certs/dev.key"
  tls_cert_file: "certs/dev.crt"

paths:
  prompt_dir: "prompts"
  releases_dir: "releases"

# --- Speech Recognition ---
asr:
  engine: "qwen3"                    # qwen3 / firered
  model: "Qwen/Qwen3-ASR-1.7B"
  device: "cuda:0"
  language: "Chinese"                # Chinese / English / Cantonese
  itn: true                          # Inverse text normalization
  vllm_gpu_util: 0.5
  vllm_max_model_len: 16384
  max_concurrency: 1
  batch_max_size: 32
  batch_wait_ms: 60
  firered:                           # Only used when engine = "firered"
    model_dir: "pretrained_models"

vad:
  model: "fsmn-vad"
  max_single_segment_time: 30000     # ms

# --- LLM Text Polishing ---
# Define all available providers below, then choose which one to use
# for desktop and web_demo. API keys go in .env file.
llm:
  desktop: "openai"                  # Provider for desktop client
  web_demo: "groq"                   # Provider for web demo (empty = disabled)

  providers:
    azure:
      deployment: "gpt-4o"
      api_version: "2024-12-01-preview"
      timeout_sec: 15
    openai:
      base_url: "https://api.openai.com"
      model: "gpt-4o-mini"
      timeout_sec: 15
      # temperature: null              # null = omit the field entirely. Reasoning models
      #                                # reject an explicit value and only accept their
      #                                # default, so omitting is the only way to adapt.
      # reasoning_effort: "none"       # none / low / medium / high. Omit to let the model
      #                                # decide. Lower effort = lower latency.
    groq:
      base_url: "https://api.groq.com/openai"
      model: "qwen/qwen3-32b"
      timeout_sec: 15
    ollama:
      url: "http://127.0.0.1:11434/api/generate"
      model: "qwen2.5:7b"
      timeout_sec: 15

# --- Landing Page ---
public_site:
  app_name: "SayIt"
  headline: "随口说，出色写"
  subheadline: "用说话代替打字，AI 实时把口语变成可以直接用的书面表达。"
  download_label: "下载 Windows 客户端"
  download_platform: "win32"
  download_arch: "x64"

# --- Browser Demo ---
web_demo:
  enabled: true
  max_duration_sec: 300              # Max recording length per session (sec), same as the desktop app
  max_concurrency_per_ip: 3

# --- Admin Dashboard ---
# Password in .env (SAYIT_ADMIN_PASSWORD)
admin:
  enabled: true
  username: "admin"

# --- Logging ---
logging:
  level: "INFO"                      # DEBUG / INFO / WARNING / ERROR
  debug_asr: false                   # Log raw ASR input/output
  debug_llm: false                   # Log raw LLM input/output
  file: "runtime/logs/sayit.log"
  retention_days: 14
  slow_asr_ms: 5000                  # Warn when ASR takes longer
  slow_llm_ms: 8000                  # Warn when LLM takes longer

# --- Telemetry ---
telemetry:
  enabled: true
  db: "sqlite"                       # sqlite / postgresql
  db_path: "runtime/telemetry/sayit.sqlite3"
  collect_window_title: true
  collect_exe_path: true
  node_id: "single-node-01"

# --- Abuse guard (WebSocket transcription) ---
# Every check is off here. Roll each one out as off -> log -> enforce: "log" only writes
# `guard violation ...` lines, "enforce" actually rejects (or skips AI polishing).
# Quote the modes: bare off / on are YAML booleans.
# The numbers below only illustrate the format; pick your own limits from your own traffic.
guard:
  # Reverse proxies in front of the backend (CIDR). X-Forwarded-For is resolved right-to-left
  # across these hops (nginx real_ip_recursive). Add your load balancer subnet, e.g. "10.0.0.0/16".
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
  # Switch the existing per-IP limits (WebSocket connections, HTTP rate limit, uploads) to the
  # resolved client IP. Leave false until `guard netid` lines show the right IP for every entry point.
  use_real_ip: false
  netid_log: false                   # One `guard netid` line per client IP every 10 minutes
  allow_ips: []                      # Matched against the resolved client IP only
  pace:                              # Live audio arriving faster than real time
    mode: "off"                      # off / log / enforce
    max_ratio: 1.5                   # Reject when audio_sec > elapsed_sec * max_ratio + grace_sec
    grace_sec: 3
  admission:                         # Client format checks: device id, version, PTT duration
    mode: "off"
  quota:                             # Audio minutes per rolling 24 hours; 0 = no limit
    mode: "off"
    device_minutes: 100
    ip_minutes: 400
    nonlive_device_minutes: 20       # Non-live sessions count here and toward device / ip too
    nonlive_ip_minutes: 50
    demo_ip_minutes: 10              # Browser demo, per IP
    internal_minutes: 1000           # Sessions from allow_ips (replaces the limits above)
    demo_global_minutes: 100         # Browser demo, whole site (desktop clients are not affected)
    # Session counts (number of starts), 0 = no limit. Rejected starts are not counted.
    demo_ip_sessions_per_hour: 5
    demo_ip_sessions_per_day: 20
    demo_global_sessions_per_hour: 100
    device_sessions_per_minute: 10   # Desktop, per device: a short window tolerates bursts,
    device_sessions_per_hour: 100    # the longer windows stop round-the-clock automation
    device_sessions_per_day: 500
    ip_sessions_per_hour: 300        # Desktop, per IP (several devices behind one NAT)
    ip_sessions_per_day: 2000
    device_empty_per_hour: 10        # Desktop sessions whose transcript is empty or a single character
  ai_budget:                         # AI polishing per rolling 24 hours; 0 = no limit
    mode: "off"                      # Over the limit: transcription still works, polishing is skipped
    device_tokens: 300000            # Tokens reported by the LLM API (input + output); estimated from characters if absent
    ip_tokens: 800000
    max_system_prompt_chars: 10000   # Sessions with a longer client system prompt skip polishing
  web_demo:                          # The browser demo must come from these sites (WebSocket Origin header)
    mode: "off"
    allowed_origins: []              # e.g. ["https://your-site.example"]
  alert:                             # One WARNING line per hour when the last hour exceeds; 0 = off
    audio_minutes_per_hour: 0
    ai_tokens_per_hour: 0
    hits_per_hour: 0
